services:
  web:
    build: .
    expose:
      - "8000"
    depends_on:
      - redis
  
  redis:
    image: "redis:alpine"
    expose:
      - "6379"

  nginx:
    image: "nginx:alpine"
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web