name: Complete CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  # Phase 1: Continuous Integration (Test & Build)
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.9'
    - name: Install Dependencies
      run: |
        pip install -r requirements.txt
        pip install pytest httpx
    - name: Run API Tests
      run: pytest test_main.py

  # Phase 2: Continuous Deployment (Push to AWS EC2)
  deploy:
    needs: build-and-test # This ensures it only deploys if tests PASS
    runs-on: ubuntu-latest
    steps:
    - name: Deploy to EC2 via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          # 1. Download the latest code
          if [ ! -d "ci-cd-practice" ]; then
            git clone https://github.com/shraddhesss/ci-cd-practice.git
          fi
          cd ci-cd-practice
          git pull origin main
          
          # 2. Stop and remove the old container if it exists
          sudo docker stop fastapi-app || true
          sudo docker rm fastapi-app || true
          
          # 3. Build and launch the new container
          sudo docker build -t my-fastapi-app .
          sudo docker run -d -p 8000:8000 --name fastapi-app my-fastapi-app
