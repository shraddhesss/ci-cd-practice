name: Complete CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  # Phase 1: Continuous Integration (Test & Build)
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.9'
    - name: Install Dependencies
      run: |
        pip install -r requirements.txt
        pip install pytest httpx
    - name: Run API Tests
      run: pytest test_main.py

  # Phase 2: Continuous Deployment (Push to AWS EC2)
  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
    - name: Deploy to EC2 via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          # 1. Download the latest code
          if [ ! -d "ci-cd-practice" ]; then
            git clone https://github.com/shraddhesss/ci-cd-practice.git
          fi
          cd ci-cd-practice
          git pull origin main
          
          # 2. Install Docker Compose on the server if it is missing
          sudo apt-get update -y
          sudo apt-get install docker-compose -y
          
          # 3. Shut down old containers and boot the new multi-container app
          sudo docker-compose down || true
          sudo docker-compose up -d --build
